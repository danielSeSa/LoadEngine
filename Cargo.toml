[package]
name = "LoadEngine"
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"

[dependencies]
winit = "0.29"
wgpu = "0.19"
pollster = "0.3"
glam = "0.24"
egui = "0.26"
egui-winit = "0.26"
egui-wgpu = "0.26"
bytemuck = { version = "1", features = ["derive"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true